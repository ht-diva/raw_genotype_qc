executor: slurm
jobs: 250
software-deployment-method:
   - conda
   - apptainer
retries: 3
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
cores: &cores 8
latency-wait: 60
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: ilp

default-resources:
    slurm_partition: cpuq
    # slurm_account: ${USER}
    mem_mb: attempt * 1024
    threads: 1
    runtime: attempt * 5

set-resources:
  inspect_bed_input:
    threads: *cores
    mem_mb: 1024 + attempt * 1024

  prepare_reported_sex:
    threads: *cores
    mem_mb: 1024 + attempt * 1024

